<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 문의 채팅 - 경동 마켓</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b2545;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .chat-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            background: #ffffff !important;
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }
        .chat-header {
            padding: 20px 25px;
            border-bottom: 1px solid #e2e8f0;
            background: #ffffff;
        }
        .product-info-bar {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 25px;
            font-size: 0.95rem;
        }
        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-row {
            width: 100%;
            margin-bottom: 4px;
        }
        .message-row.my-message {
            text-align: right;
        }
        .message-row.other-message {
            text-align: left;
        }
        
        /* 💡 말풍선 크기를 내용에 딱 맞추는 설정 */
        .message-bubble {
            max-width: 70% !important;
            display: table !important;
            width: auto !important;
            padding: 8px 14px !important;
            border-radius: 14px !important;
            font-size: 0.95rem !important;
            line-height: 1.4 !important;
            word-break: break-word !important;
            white-space: pre-wrap !important;
            text-align: left !important;
        }

        .my-message .message-bubble {
            background-color: #134074;
            color: white;
            border-top-right-radius: 4px;
            margin-left: auto;
            margin-right: 0;
        }
        
        .other-message .message-bubble {
            background-color: #ffffff;
            color: #212529;
            border: 1px solid #e2e8f0;
            border-top-left-radius: 4px;
            margin-left: 0;
            margin-right: auto;
        }

        /* 💡 작성자 이름 가독성 색상 */
        .my-message .message-bubble .chat-username {
            color: #cbd5e1 !important;
        }
        .other-message .message-bubble .chat-username {
            color: #64748b !important;
        }

        .chat-input-area {
            padding: 15px 25px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        
        /* 💡 입력창과 전송 버튼 세로 정렬 및 높이 고정 */
        #chatForm {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-control {
            height: 46px;
            border-radius: 12px;
            padding: 0 16px;
            border: 1px solid #ced4da;
        }
        .form-control:focus {
            border-color: #134074;
            box-shadow: 0 0 0 0.2rem rgba(19, 64, 116, 0.15);
        }
        .btn-send {
            height: 46px;
            background-color: #fee500;
            color: #3c1e1e;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-send:hover {
            background-color: #fdd835;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="chat-card">
            <!-- 채팅 헤더 -->
            <div class="chat-header d-flex justify-content-between align-items-center">
                <h5 class="fw-bold text-dark m-0"><i class="fa-regular fa-comments text-primary me-2"></i>실시간 문의 채팅</h5>
                <a href="{{ url_for('detail', post_id=post.id if post else 1) }}" class="text-decoration-none text-muted small fw-semibold">
                    &larr; 상품 상세로 돌아가기
                </a>
            </div>

            <!-- 상품 요약 바 -->
            <div class="product-info-bar d-flex justify-content-between align-items-center">
                <span class="text-secondary fw-semibold text-truncate"><i class="fa-solid fa-box me-1"></i> {{ post.title if post else '상품 정보' }}</span>
                <span class="fw-bold text-dark flex-shrink-0 ms-3">{{ "{:,}".format(post.price) if post else '0' }}원</span>
            </div>

            <!-- 메시지 출력 영역 -->
            <div class="chat-messages" id="chatMessages">
                {% for msg in messages %}
                    <div class="message-row {% if msg.sender_id|string == session.get('user_id')|string %}my-message{% else %}other-message{% endif %}">
                        <div class="message-bubble shadow-sm">
                            <div class="fw-bold chat-username mb-1" style="font-size: 0.65rem;">{{ msg.username }}</div>
                            <div style="margin: 0; padding: 0;">{{ msg.message }}</div>
                        </div>
                    </div>
                {% endfor %}
            </div>

            <!-- 메시지 입력 영역 -->
            <div class="chat-input-area">
                <form id="chatForm">
                    <input type="text" id="messageInput" class="form-control flex-grow-1" placeholder="메시지를 입력하세요..." autocomplete="off" required>
                    <button type="submit" class="btn btn-send">전송</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 실시간 비동기 채팅 스크립트 -->
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        
        const pathSegments = window.location.pathname.split('/');
        let postId = "{{ post.id if post else '' }}";
        if (!postId && pathSegments.length >= 3) {
            postId = pathSegments[2];
        }
        
        const currentUserId = "{{ session.get('user_id') }}";

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        scrollToBottom();

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message || !postId) return;

            fetch(`/posts/${postId}/chat/send`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    messageInput.value = '';
                    loadMessages();
                }
            })
            .catch(error => console.error('Error:', error));
        });

        function loadMessages() {
            if (!postId) return;
            fetch(`/posts/${postId}/chat/messages`)
            .then(response => response.json())
            .then(data => {
                chatMessages.innerHTML = '';
                data.messages.forEach(msg => {
                    const isMyMessage = String(msg.sender_id) === String(currentUserId);
                    const rowDiv = document.createElement('div');
                    rowDiv.className = `message-row ${isMyMessage ? 'my-message' : 'other-message'}`;
                    
                    rowDiv.innerHTML = `
                        <div class="message-bubble shadow-sm">
                            <div class="fw-bold chat-username mb-1" style="font-size: 0.65rem;">${msg.username}</div>
                            <div style="margin: 0; padding: 0;">${msg.message}</div>
                        </div>
                    `;
                    chatMessages.appendChild(rowDiv);
                });
                scrollToBottom();
            })
            .catch(error => console.error('Error:', error));
        }

        setInterval(loadMessages, 2000);
    </script>
</body>
</html>
