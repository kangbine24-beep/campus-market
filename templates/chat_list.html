<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 채팅 목록 - 경동 마켓</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b2545;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .chat-list-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            background: #ffffff !important;
            padding: 30px;
        }
        .chat-item {
            transition: transform 0.2s, background-color 0.2s;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 15px;
            margin-bottom: 12px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f8fafc;
        }
        .chat-item:hover {
            transform: translateY(-2px);
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }
        .chat-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-list-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold text-dark m-0"><i class="fa-regular fa-comments text-primary me-2"></i>실시간 문의 채팅함</h4>
                <a href="{{ url_for('index') }}" class="text-decoration-none text-muted fw-semibold">&larr; 메인으로 돌아가기</a>
            </div>

            <div class="list-group" id="chat-list-container">
                {% for chat in my_chats %}
                    <a href="{{ url_for('chat_room', post_id=chat.post_id) }}" class="chat-item">
                        {% if chat.image_filename %}
                            <img src="{{ url_for('static', filename='uploads/' + chat.image_filename) }}" class="chat-thumb" alt="상품 이미지">
                        {% else %}
                            <div class="chat-thumb d-flex align-items-center justify-content-center text-muted">
                                <i class="fa-regular fa-image"></i>
                            </div>
                        {% endif %}
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <h6 class="fw-bold text-dark m-0 text-truncate" style="max-width: 400px;">{{ chat.title }}</h6>
                                <span class="badge bg-primary-subtle text-primary border">채팅 바로가기</span>
                            </div>
                            <p class="text-muted small m-0">상품 가격: {{ "{:,}".format(chat.price) }}원</p>
                        </div>
                    </a>
                {% else %}
                    <div class="text-center py-5 text-muted" id="no-chat-msg">
                        <i class="fa-regular fa-folder-open fa-3x mb-3"></i>
                        <p>진행 중인 채팅 문의가 없습니다.</p>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- 3초마다 채팅 목록을 자동으로 갱신하는 스크립트 -->
    <script>
        setInterval(async () => {
            try {
                let response = await fetch('/api/chats');
                if (!response.ok) return;
                let data = await response.json();
                let chats = data.chats;

                let container = document.getElementById('chat-list-container');
                
                if (chats.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5 text-muted" id="no-chat-msg">
                            <i class="fa-regular fa-folder-open fa-3x mb-3"></i>
                            <p>진행 중인 채팅 문의가 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                let htmlContent = '';
                chats.forEach(chat => {
                    let thumbHtml = chat.image_filename 
                        ? `<img src="/static/uploads/${chat.image_filename}" class="chat-thumb" alt="상품 이미지">`
                        : `<div class="chat-thumb d-flex align-items-center justify-content-center text-muted"><i class="fa-regular fa-image"></i></div>`;
                    
                    let formattedPrice = Number(chat.price).toLocaleString();

                    htmlContent += `
                        <a href="/posts/${chat.post_id}/chat" class="chat-item">
                            ${thumbHtml}
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <h6 class="fw-bold text-dark m-0 text-truncate" style="max-width: 400px;">${chat.title}</h6>
                                    <span class="badge bg-primary-subtle text-primary border">채팅 바로가기</span>
                                </div>
                                <p class="text-muted small m-0">상품 가격: ${formattedPrice}원</p>
                            </div>
                        </a>
                    `;
                });

                container.innerHTML = htmlContent;
            } catch (error) {
                console.error("채팅 목록 동기화 실패:", error);
            }
        }, 3000);
    </script>
</body>
</html>
