<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>경동 마켓 - 상품 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b2545;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 40px;
            margin-bottom: 50px;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            padding: 40px;
            background: #ffffff !important;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ced4da;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #134074;
            box-shadow: 0 0 0 0.2rem rgba(19, 64, 116, 0.15);
        }
        .btn-kdu {
            background-color: #134074;
            color: #ffffff;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px;
            transition: all 0.2s;
        }
        .btn-kdu:hover {
            background-color: #0b2545;
            color: #ffffff;
        }
        .btn-outline-cancel {
            border: 1px solid #dee2e6;
            color: #495057;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px;
            background: white;
            transition: all 0.2s;
        }
        .btn-outline-cancel:hover {
            background-color: #f8f9fa;
            color: #212529;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h3 class="fw-bold text-dark m-0">
                    <i class="fa-solid fa-circle-plus text-primary me-2"></i> 물품 등록하기
                </h3>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold">
                    <i class="fa-solid fa-house me-1"></i> 홈으로
                </a>
            </div>

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">제목</label>
                    <input type="text" name="title" class="form-control" placeholder="예: 자바 프로그래밍 교재 또는 스마트패드" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">카테고리</label>
                        <select name="category" class="form-select" required>
                            <option value="" disabled selected>카테고리 선택</option>
                            <option value="전공서적">전공서적</option>
                            <option value="생활용품">생활용품</option>
                            <option value="전자기기">전자기기</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">가격 (원)</label>
                        <input type="number" name="price" class="form-control" placeholder="숫자만 입력" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">상품 상태</label>
                        <select name="condition" class="form-select" required>
                            <option value="" disabled selected>상태 선택</option>
                            <option value="새상품">새상품</option>
                            <option value="거의 새것">거의 새것</option>
                            <option value="사용감 있음">사용감 있음</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" id="dept-label">학과</label>
                        <input type="text" name="department" class="form-control" placeholder="예: 소프트웨어학과">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">상품 이미지</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="mb-4">
                    <label class="form-label">상세 설명</label>
                    <textarea name="content" class="form-control" rows="5" placeholder="상품에 대한 자세한 설명을 적어주세요." required></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-cancel col-md-3">취소</a>
                    <button type="submit" class="btn btn-kdu col-md-3">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const categorySelect = document.querySelector('select[name="category"]');
            const departmentInput = document.querySelector('input[name="department"]');
            const departmentLabel = document.getElementById('dept-label');

            categorySelect.addEventListener('change', function() {
                if (this.value === '전공서적') {
                    departmentInput.setAttribute('required', 'required');
                    if (!departmentLabel.innerHTML.includes('*')) {
                        departmentLabel.innerHTML += ' <span class="text-danger">*</span>';
                    }
                } else {
                    departmentInput.removeAttribute('required');
                    departmentLabel.innerHTML = departmentLabel.innerHTML.replace(' <span class="text-danger">*</span>', '');
                }
            });
        });
    </script>
</body>
</html>
