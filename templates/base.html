<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>경동 마켓 - 대학생 중고거래</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .badge-notification {
            position: relative;
            top: -2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header d-flex justify-content-between align-items-center py-3 mb-4 border-bottom">
            <h1><a href="/" class="text-decoration-none text-dark fw-bold">경동 마켓</a></h1>
            <div class="user-info d-flex align-items-center gap-2">
                {% if session.get('username') %}
                    <span><strong>{{ session['username'] }}</strong>님</span>
                    <a href="{{ url_for('chat_list') }}" class="btn btn-outline-secondary btn-sm position-relative">
                        <i class="fa-regular fa-comments"></i> 채팅함
                        {% if unread_count and unread_count > 0 %}
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger badge-notification">
                                {{ unread_count }}
                            </span>
                        {% endif %}
                    </a>
                    <a href="{{ url_for('create') }}" class="btn btn-primary btn-sm">+ 상품 등록</a>
                    <a href="{{ url_for('logout') }}" class="btn btn-secondary btn-sm">로그아웃</a>
                {% else %}
                    <a href="{{ url_for('login') }}" class="btn btn-primary btn-sm">로그인</a>
                    <a href="{{ url_for('register') }}" class="btn btn-secondary btn-sm">회원가입</a>
                {% endif %}
            </div>
        </header>

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
