<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>경동 마켓 - 비밀번호 재설정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b2545;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 40px 0;
        }
        .auth-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            background: #ffffff;
            width: 100%;
            max-width: 850px;
        }
        .left-banner {
            background: linear-gradient(135deg, #0b2545 0%, #134074 100%);
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-form {
            padding: 40px 50px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #ced4da;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #134074;
            box-shadow: 0 0 0 0.2rem rgba(19, 64, 116, 0.15);
        }
        .btn-kdu {
            background-color: #134074;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px;
            transition: background 0.2s;
        }
        .btn-kdu:hover {
            background-color: #0b2545;
            color: white;
        }
        .feature-list {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }
        .feature-list li {
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card auth-card">
                    <div class="row g-0">
                        <!-- 좌측 브랜드 배너 -->
                        <div class="col-md-5 left-banner">
                            <h2 class="fw-bold mb-3"><i class="fa-solid fa-graduation-cap me-2"></i>KD-Market</h2>
                            <p class="text-white-50 mb-0">경동대학교 학생들을 위한 안전하고 스마트한 중고거래 플랫폼</p>
                            <ul class="feature-list">
                                <hr class="border-light opacity-25 my-3">
                                <li><i class="fa-solid fa-check text-warning"></i> 학번 인증 재학생 전용</li>
                                <li><i class="fa-solid fa-check text-warning"></i> AI 자동 요약 및 다중 키워드 검색</li>
                                <li><i class="fa-solid fa-check text-warning"></i> 14일 자동 만료 거래 관리</li>
                            </ul>
                        </div>

                        <!-- 우측 비밀번호 재설정 폼 -->
                        <div class="col-md-7 right-form">
                            <h3 class="fw-bold text-dark mb-3">비밀번호 재설정</h3>

                            {% if error %}
                                <div class="alert alert-danger py-2 px-3 rounded-3 small mb-3" role="alert">
                                    <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
                                </div>
                            {% endif %}
                            
                            {% if success %}
                                <div class="alert alert-success py-2 px-3 rounded-3 small mb-3" role="alert">
                                    <i class="fa-solid fa-circle-check me-1"></i> {{ success }}
                                </div>
                            {% endif %}

                            <form method="POST">
                                <div class="mb-2">
                                    <label class="form-label small fw-bold text-secondary mb-1">아이디 또는 학번</label>
                                    <input type="text" name="username" class="form-control" placeholder="가입한 아이디 또는 학번 입력" required autofocus>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-secondary mb-1">새로운 비밀번호</label>
                                    <input type="password" name="password" class="form-control" placeholder="새로운 비밀번호 입력" required>
                                </div>

                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-kdu">비밀번호 변경하기</button>
                                </div>

                                <div class="text-center text-muted small">
                                    기억이 나셨나요? <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold text-primary">로그인 하기</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
